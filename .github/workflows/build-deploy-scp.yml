# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD
name: Build e envio via SCP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-scp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Criar arquivo gw2-wvw-discord-bot.tar.gz
        run: tar -czf gw2-wvw-discord-bot.tar.gz -C dist .

      - name: Enviar via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: gw2-wvw-discord-bot.tar.gz
          target: ~/gw2-wvw-discord-bot

      - name: Extrair no servidor e remover o .tar.gz
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "$HOME/gw2-wvw-discord-bot"
            tar -xzvf gw2-wvw-discord-bot.tar.gz
            rm -f gw2-wvw-discord-bot.tar.gz

      - name: PM2 ecosystem
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "$HOME/gw2-wvw-discord-bot"
            pm2 startOrReload pm2/ecosystem.config.cjs --update-env
