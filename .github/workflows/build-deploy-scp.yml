# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD e um secret por variável em .env.example (ex.: DISCORD_TOKEN, CLIENT_ID, POSTGRES_URI)
name: Build e envio via SCP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-scp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Criar arquivo gw2-wvw-discord-bot.tar.gz
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          POSTGRES_URI: ${{ secrets.POSTGRES_URI }}
        run: |
          set -e
          mkdir -p .deploy
          cp -a dist/. .deploy/
          cp package.json package-lock.json .deploy/
          cp -a pm2 .deploy/
          cp -a config .deploy/
          cp -a migrations .deploy/
          cp .sequelizerc .deploy/
          VARS=$(grep -oE '\$[A-Za-z_][A-Za-z0-9_]*' .env.example | sort -u | tr '\n' ' ')
          if [ -n "$VARS" ]; then
            envsubst "$VARS" < .env.example > .deploy/.env
          else
            cp .env.example .deploy/.env
          fi
          tar -czf gw2-wvw-discord-bot.tar.gz -C .deploy .
          rm -rf .deploy

      - name: Enviar via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: gw2-wvw-discord-bot.tar.gz
          target: ~/gw2-wvw-discord-bot
  server-commands:
    needs: build-and-scp
    runs-on: ubuntu-latest
    steps:
      - name: Extrair no servidor e remover o .tar.gz
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "$HOME/gw2-wvw-discord-bot"
            tar -xzvf gw2-wvw-discord-bot.tar.gz
            rm -f gw2-wvw-discord-bot.tar.gz

      - name: Instalar dependências no servidor (npm i --omit=dev)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "$HOME/gw2-wvw-discord-bot"
            npm i --omit=dev

      - name: Migrações do banco (sequelize-cli)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "$HOME/gw2-wvw-discord-bot"
            npx sequelize-cli db:migrate

      - name: Registrar comandos Discord (deploy-commands.js)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "$HOME/gw2-wvw-discord-bot"
            node deploy-commands.js

      - name: PM2 ecosystem
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "$HOME/gw2-wvw-discord-bot"
            pm2 startOrReload pm2/ecosystem.config.cjs --update-env
